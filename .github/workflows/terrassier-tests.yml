name: Terrassier — tests métier
on:
  push:
    paths:
      - 'terrassier/**'
      - '.github/workflows/terrassier-tests.yml'
  pull_request:
    paths:
      - 'terrassier/**'
      - '.github/workflows/terrassier-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests moteur Terrassier
        run: node --test terrassier/tests/engine.test.mjs

name: Terrassier — validation moteur et interface
on:
  push:
    paths:
      - 'terrassier/**'
      - '.github/workflows/terrassier-tests.yml'
  pull_request:
    paths:
      - 'terrassier/**'
      - '.github/workflows/terrassier-tests.yml'
jobs:
  tests-metier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exécuter les tests métier
        run: node --test terrassier/tests/engine.test.mjs
  tests-navigateur:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer navigateur Chromium
        run: |
          npm install --prefix terrassier --no-audit --no-fund
          npx --prefix terrassier playwright install --with-deps chromium
      - name: Vérifier la démo depuis un navigateur réel
        run: |
          python3 -m http.server 8020 --bind 127.0.0.1 >/tmp/terrassier-server.log 2>&1 &
          sleep 2
          npm run test:e2e --prefix terrassier

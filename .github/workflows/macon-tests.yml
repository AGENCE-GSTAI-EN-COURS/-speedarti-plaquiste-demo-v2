name: Maçon — tests et audit balisage

on:
  push:
    branches: [main]
    paths:
      - 'macon/**'
      - '.github/workflows/macon-tests.yml'
  pull_request:
    paths:
      - 'macon/**'
      - '.github/workflows/macon-tests.yml'
  workflow_dispatch:

jobs:
  macon-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests fonctionnels Maçon
        run: node macon/tests.mjs

      - name: Audit balisage Maçon
        run: node macon/audit_balisage_macon.mjs

<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Démonstration de travail du module Plombier existant de SpeedArti." />
  <title>SpeedArti — Démo Plombier</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="../" aria-label="Retour aux métiers">
        <div class="logo">S</div>
        <div>
          <strong>Nouveau Chiffrage de Chantier</strong>
          <span>Métier : Plombier</span>
        </div>
      </a>
      <div class="actions">
        <span class="badge work">Version de travail v0.8.1</span>
        <button id="resetBtn" class="btn secondary">Réinitialiser</button>
        <button id="saveBtn" class="btn secondary">Enregistrer</button>
        <button id="calcBtn" class="btn primary">Calculer</button>
      </div>
    </header>

    <div class="work-note">
      <strong>Chiffrage plomberie.</strong>
      <span>Dimensionne le chantier et les distances du chauffe-eau, ajoute les sanitaires à l’étape suivante, puis configure uniquement les éléments nécessaires avec les options.</span>
    </div>

    <nav id="steps" class="steps"></nav>
    <main>
      <section id="content"></section>
      <footer>
        <button id="prev" class="btn secondary">← Précédent</button>
        <button id="next" class="btn primary">Suivant →</button>
      </footer>
    </main>
  </div>
  <script src="./catalogue-data.js"></script>
  <script src="./catalogue-service.js"></script>
  <script src="./engine-current.js"></script>
  <script src="./angel-knowledge.js"></script>
  <script src="./app.js"></script>
<script src="../shared/field-navigation.js"></script>
</body>
</html>
